services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TODO: add migrator service once health check endpoint is wired to DB
  # migrator:
  #   build:
  #     context: .
  #     dockerfile: packages/api/Dockerfile
  #   command: >
  #     bash -c "cd /app/packages/shared && alembic upgrade head"
  #   env_file: .env
  #   depends_on:
  #     db:
  #       condition: service_healthy

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # TODO: switch to migrator dependency once migrator service is added
    # depends_on:
    #   migrator:
    #     condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # TODO: switch to migrator dependency once migrator service is added
    # depends_on:
    #   migrator:
    #     condition: service_completed_successfully

volumes:
  postgres_data:
